name: Build and test
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build reference Asterisk
        run: docker build --target asterisk -f ci/Dockerfile -t asterisk-jio-sdk .
      - name: Test and package without network access
        env:
          ADDON_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          docker run --rm --network=none --hostname localhost --env ADDON_VERSION \
            -v "$PWD:/work" asterisk-jio-sdk sh -c 'make test && make package'
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.arch }}
          path: build/test-*.log
          if-no-files-found: ignore
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  nix:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check -L
      - run: nix build .#asterisk-with-jio -L

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, nix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Verify package checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "$RELEASE_TAG" \
            --notes "Jio IMS and AMR/AMR-WB addon for Asterisk 22.11.0. Binaries require the matching reference build; see README and build-info.json."
