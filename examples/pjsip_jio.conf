; Copy to /etc/asterisk/pjsip_jio.conf and replace the example values.
; This configures the compatibility module. Configure the transport,
; outbound registration, auth/password, endpoint and dialplan in pjsip.conf.
[general]
realm = dl.wln.ims.jio.com
username = 91YOUR_LINE@dl.wln.ims.jio.com
digest_uri = sip:dl.wln.ims.jio.com
access_network = IEEE-802.3
; Use the stable instance identity from your existing IMS configuration.
; Bare UUID, without quotes or angle brackets. Required for Contact features.
instance_id = 00000000-0000-1000-8000-000000000001
